name: Build and publish 360 CLI APT repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (for example 1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 360-cli-apt
  cancel-in-progress: false

env:
  PACKAGE_NAME: 360-cli

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install APT tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Determine version
        id: meta
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${DISPATCH_VERSION}" ]]; then
            version="${DISPATCH_VERSION}"
          else
            version="0.0.0-${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Debian version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 ./build-deb.sh
          bash ./build-deb.sh "${{ steps.meta.outputs.version }}"

      - name: Verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          package="${PACKAGE_NAME}_${{ steps.meta.outputs.version }}_all.deb"
          test -f "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | grep -E '/usr/bin/360$|/usr/share/360-cli/360.sh$'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: 360-cli_${{ steps.meta.outputs.version }}_all.deb
          generate_release_notes: true

      - name: Build APT repository
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          site="$RUNNER_TEMP/pages"
          repo="$site/apt"
          pool="$repo/pool/main"
          dist="$repo/dists/stable"
          binary="$dist/main/binary-all"
          package="360-cli_${VERSION}_all.deb"

          rm -rf "$site"
          mkdir -p "$pool" "$binary"
          cp "$package" "$pool/"

          (
            cd "$repo"
            dpkg-scanpackages pool /dev/null > "$binary/Packages"
          )
          gzip -9c "$binary/Packages" > "$binary/Packages.gz"

          printf '%s\n' \
            'Origin: 360 CLI' \
            'Label: 360 CLI' \
            'Suite: stable' \
            'Codename: stable' \
            'Architectures: all' \
            'Components: main' \
            'Description: 360 CLI APT repository' \
            > "$dist/Release"

          apt-ftparchive release "$dist" >> "$dist/Release"

          base="https://${OWNER}.github.io/${REPOSITORY#*/}/apt"

          cat > "$repo/install-repository.sh" <<EOF_INSTALL
          #!/usr/bin/env bash
          set -euo pipefail
          
          REPO_URL="$base"
          SOURCE="/etc/apt/sources.list.d/360-cli.list"
          
          if [[ "\${EUID}" -ne 0 ]]; then
            echo "Run this installer as root: sudo bash install-repository.sh" >&2
            exit 1
          fi
          
          printf '%s\\n' "deb [arch=all trusted=yes] \$REPO_URL stable main" > "\$SOURCE"
          chmod 0644 "\$SOURCE"
          apt-get update
          apt-get install -y 360-cli
          EOF_INSTALL
          chmod 0755 "$repo/install-repository.sh"

          cat > "$site/index.html" <<EOF_INDEX
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>360 CLI APT</title>
          </head>
          <body>
            <h1>360 CLI APT repository</h1>
            <p><code>$base</code></p>
            <p>One-time repository setup:</p>
            <pre>curl -fsSL $base/install-repository.sh | sudo bash</pre>
            <p>Then:</p>
            <pre>sudo apt install 360-cli</pre>
            <p>Updates:</p>
            <pre>sudo apt update &amp;&amp; sudo apt upgrade</pre>
          </body>
          </html>
          EOF_INDEX

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
